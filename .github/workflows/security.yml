name: AppSec Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays at midnight UTC

# 1. LEAST PRIVILEGE: Read-only by default
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------
  # Secret Scanning (TruffleHog)
  # ---------------------------------------------------------
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # Pinned to full SHA (v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0 # Full history is required for TruffleHog

      - name: TruffleHog OSS
        # Pinned to full SHA (v3)
        uses: trufflesecurity/trufflehog@e0ec5a38ad7f0c2d4a85b0b10f3c82a60bb9cc6c
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # ---------------------------------------------------------
  # Software Composition Analysis (Trivy)
  # ---------------------------------------------------------
  sca-scan:
    name: Dependency & IaC Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # Pinned to full SHA (v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run Trivy vulnerability scanner in fs mode
        # Pinned to full SHA (v0.28.0)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1' # Fail the job if vulnerabilities are found
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # ---------------------------------------------------------
  # Static Application Security Testing (Semgrep)
  # ---------------------------------------------------------
  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # Pinned to full SHA (v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run Semgrep
        # Pinned to full SHA (v1)
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4d5e
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
